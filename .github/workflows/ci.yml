name: CI

# Mirrors AGENTS.md §32's recommended stages: checkout -> backend build -> backend unit tests ->
# backend integration tests -> frontend install -> frontend lint/test -> frontend build -> docker
# build. The backend doesn't separate unit vs. integration tests into different Maven phases (no
# failsafe/surefire-IT split configured), so both run together via `mvn test` — the mandatory
# concurrency test and the inventory tests are both Testcontainers-based integration tests in
# practice already. Frontend automated tests (Vitest) aren't set up yet (see
# KNOWN_LIMITATIONS.md), so "frontend test" is lint-only for now.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    # Both test classes are @SpringBootTest, which boots the full application context — including
    # the RabbitMQ listener container and the Redis-backed caches — even though only Postgres is
    # provided via Testcontainers. Without these two service containers the context fails to
    # start in CI. See KNOWN_LIMITATIONS.md ("needs a local Redis/RabbitMQ that aren't part of its
    # Testcontainers setup").
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend dependency resolution / build
        run: mvn -B -DskipTests clean package

      # Runs both the unit-level inventory tests and the mandatory concurrency / integration test
      # (both self-contained via Testcontainers for Postgres). Docker-in-Docker is available by
      # default on GitHub-hosted ubuntu runners, which is what Testcontainers needs.
      - name: Backend unit + integration tests (incl. mandatory concurrency test)
        run: mvn -B test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # No Vitest/React Testing Library suite exists yet (see KNOWN_LIMITATIONS.md) — `tsc -b`
      # inside the build step below is the closest thing to a frontend test in this pipeline today.
      - name: Type-check + production build
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds both images to prove the Dockerfiles are valid (this is what the assignment's CI
      # stage list asks for) without needing a full `docker compose up` with live Postgres/
      # Redis/RabbitMQ dependencies, which this job doesn't provision.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: order-inventory-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: order-inventory-frontend:ci
