version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: order-inventory-postgres
    environment:
      POSTGRES_DB: order_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: order-inventory-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: order-inventory-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: order-inventory-backend
    environment:
      # Container-to-container traffic uses Postgres' actual listening port (5432); the 5433
      # mapping in the postgres service below only affects access from the host machine.
      DB_URL: jdbc:postgresql://postgres:5432/order_inventory
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Hibernate / JPA — schema is owned by Flyway (see application.yml); ddl-auto stays at its
      # default (validate) so restarting the stack never drops data.
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"

      # =========================
      # Logging
      # =========================
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_UPHEAD: DEBUG

      # Hibernate SQL logging (query shape only — no bound parameter values)
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: DEBUG

      # Hibernate 6 / Spring Boot 3 SQL parameter logging. Left at WARN deliberately: at TRACE this
      # logs every bound parameter verbatim, including bcrypt hashes and raw refresh-token strings.
      LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND: WARN

      # Spring Security logging. Left at INFO deliberately, for the same reason as above.
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      JWT_EXPIRATION: 86400000
      JWT_REFRESH_EXPIRATION: 604800000
      # Same-origin in this compose file (nginx proxies /api to this service on the frontend's own
      # origin), so CORS isn't actually exercised here — set for anyone hitting the backend
      # directly at localhost:8080 instead of through the frontend's nginx proxy.
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      # Persists the generated JWT signing keypair across container recreation. Without this,
      # every `docker compose up` after the first regenerates the key (JwtKeyConfig.java) and
      # invalidates every previously-issued access token (refresh tokens still work, since those
      # are looked up in Postgres, not verified against this key).
      - jwt_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: order-inventory-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        # Previously a plain dependency (starts-before, not ready-before): nginx could come up and
        # proxy requests before the backend finished its ~60s startup, returning 502s in the
        # meantime. See KNOWN_LIMITATIONS.md "Addressed in this pass".
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  jwt_keys:
